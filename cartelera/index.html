<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cartelera</title>
  <style>
    :root {
      --night: #1b1726;
      --paper: #f1e8d4;
      --ink: #2a2233;
      --muted: #6f6478;
      --gold: #c9971c;
      --gold-soft: #f6e3a6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 3rem 1.5rem;
      background: var(--night);
      color: var(--paper);
      font-family: Georgia, "Times New Roman", serif;
    }
    header { max-width: 60rem; margin: 0 auto 2.5rem; }
    h1 { font-size: clamp(2.5rem, 7vw, 4.5rem); margin: 0; font-weight: 700; letter-spacing: -0.02em; }
    header p { margin: .5rem 0 0; color: #b9aec6; }

    #cartelera {
      max-width: 60rem;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(15rem, 1fr));
      gap: 1.25rem;
    }

    .movie-card {
      position: relative;
      padding: 1.5rem 1.25rem 1.25rem;
      background: var(--paper);
      color: var(--ink);
      border: 3px solid transparent;
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      gap: .5rem;
      min-height: 11rem;
    }
    .movie-card__title { margin: 0; font-size: 1.35rem; line-height: 1.2; }
    .movie-card__meta { margin: 0; color: var(--muted); font-size: .95rem; }
    .movie-card__score { margin: auto 0 0; font-size: .95rem; color: var(--muted); }
    .movie-card__score strong { font-size: 2rem; color: var(--ink); }

    .movie-card--gold {
      border-color: var(--gold);
      background: linear-gradient(180deg, var(--gold-soft), var(--paper) 55%);
      box-shadow: 0 0 0 2px var(--night), 0 0 0 4px var(--gold);
    }
    .movie-card--gold .movie-card__score strong { color: #8a6208; }
    .movie-card__badge {
      align-self: flex-start;
      padding: .2rem .6rem;
      background: var(--gold);
      color: #fff;
      border-radius: 999px;
      font-family: system-ui, sans-serif;
      font-size: .8rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <h1>Cartelera</h1>
    <p>Las películas con 8 o más llevan borde dorado y estrella.</p>
  </header>
  <main id="cartelera" aria-live="polite">Cargando…</main>

  <script src="scripts/types/movie.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
